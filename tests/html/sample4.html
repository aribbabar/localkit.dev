<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        display: flex;
      }
      .sidebar {
        width: 200px;
        background: #111;
        color: white;
        height: 100vh;
        padding: 20px;
      }
      .main {
        flex: 1;
        padding: 20px;
        background: #f0f2f5;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .box {
        background: white;
        padding: 20px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>Menu</h2>
      <p>Dashboard</p>
      <p>Settings</p>
    </div>
    <div class="main">
      <h1>Dashboard</h1>
      <div class="grid">
        <div class="box">Widget 1</div>
        <div class="box">Widget 2</div>
        <div class="box">Widget 3</div>
      </div>
    </div>
  </body>
</html>
