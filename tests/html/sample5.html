<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form Test</title>
    <style>
      body {
        font-family: Arial;
        background: #eef2f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      form {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
      }
      input,
      button {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <form>
      <h2>Login</h2>
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button>Submit</button>
    </form>
  </body>
</html>
