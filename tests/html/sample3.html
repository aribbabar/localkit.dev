<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basic Styled Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
      }
      header {
        background: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .container {
        padding: 20px;
      }
      .card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Test Page</h1>
    </header>
    <div class="container">
      <div class="card">Card 1 content</div>
      <div class="card">Card 2 content</div>
    </div>
  </body>
</html>
